<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Gemini CLI and LUCH: terminal to operational report</title><desc id="d">A terminal task selects a server, runs bounded checks and returns an evidence report.</desc><rect width="1200" height="360" rx="22" fill="#F5F3EA"/><text x="42" y="52" fill="#5F776D" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">GEMINI CLI / FROM TERMINAL TO EVIDENCE</text><rect x="36" y="136" width="245" height="164" rx="16" fill="#15392F"/><text x="60" y="174" fill="#E7B6A6" font-family="Arial" font-size="15" font-weight="700">01 / TERMINAL</text><text x="60" y="219" fill="#FFFFFF" font-family="Arial" font-size="22" font-weight="700">Task</text><text x="60" y="258" fill="#B9CDC1" font-family="Arial" font-size="16">What is the state?</text><path d="M281 218 H334 M321 205 L335 218 L321 231" stroke="#E98065" stroke-width="4" fill="none"/><rect x="352" y="112" width="280" height="210" rx="18" fill="#FFFFFF" stroke="#D8E1D5"/><text x="378" y="153" fill="#5F776D" font-family="Arial" font-size="15" font-weight="700">02 / CHECK</text><text x="378" y="198" fill="#15392F" font-family="Arial" font-size="21" font-weight="700">Selected server</text><text x="378" y="236" fill="#15392F" font-family="Arial" font-size="21" font-weight="700">Bounded commands</text><text x="378" y="281" fill="#5F776D" font-family="Arial" font-size="16">Observe before action</text><path d="M632 218 H685 M672 205 L686 218 L672 231" stroke="#E98065" stroke-width="4" fill="none"/><rect x="703" y="112" width="459" height="210" rx="18" fill="#15392F"/><text x="730" y="153" fill="#E7B6A6" font-family="Arial" font-size="15" font-weight="700">03 / EVIDENCE REPORT</text><text x="730" y="199" fill="#FFFFFF" font-family="Arial" font-size="21" font-weight="700">Observed status</text><text x="730" y="239" fill="#FFFFFF" font-family="Arial" font-size="21" font-weight="700">Command output</text><text x="730" y="281" fill="#B9CDC1" font-family="Arial" font-size="17">PASS · PARTIAL · UNKNOWN</text><text x="40" y="342" fill="#5F776D" font-family="Arial" font-size="13">A designed workflow · the selected server and permission scope stay explicit</text></svg>